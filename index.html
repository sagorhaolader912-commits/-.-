<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মেসার্স সাগর ফিস</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f4f6f9; font-family: Arial, sans-serif; }
        
        /* সহজ লগইন বক্স */
        #login-page { 
            position: fixed; inset: 0; background: white; z-index: 999; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
        }
        .login-box { width: 260px; padding: 30px; border: 1px solid #ddd; border-radius: 15px; text-align: center; }
        .site-name { color: #1a73e8; font-size: 18px; font-weight: bold; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; text-align: center; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* মেইন বডি */
        #main-app { display: none; padding-top: 60px; }
        .header { position: fixed; top: 0; width: 100%; background: #1a73e8; color: white; padding: 15px; text-align: center; font-weight: bold; z-index: 100; }
        
        .menu-area { display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 20px; }
        .card { background: white; width: 90%; max-width: 350px; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; border: 1px solid #eee; }
        
        .main-btn { width: 100%; padding: 15px; border: none; border-radius: 10px; color: white; font-weight: bold; font-size: 18px; margin-bottom: 10px; }
        .btn-arat { background: #28a745; }
        .btn-sale { background: #e91e63; }

        /* জমা ও জের - ছোট ফন্ট */
        .stats { font-size: 13px; font-weight: 600; line-height: 1.6; }
        .stat-joma { color: #2e7d32; }
        .stat-jer { color: #c62828; }

        .back-bar { display: none; background: #eee; padding: 10px; text-align: left; }
    </style>
</head>
<body>

    <div id="login-page">
        <div class="login-box">
            <div class="site-name">মেসার্স সাগর ফিস</div>
            <input type="number" id="scCode" placeholder="সিকিউরিটি কোড লিখুন">
            <button onclick="doLogin()">লগইন করুন</button>
        </div>
    </div>

    <div id="main-app">
        <div class="header">মেসার্স সাগর ফিস</div>
        
        <div class="menu-area">
            <div class="card">
                <button class="main-btn btn-arat" onclick="alert('তালিকা লোড হচ্ছে...')">আড়ৎ এর হিসাব</button>
                <div class="stats">
                    <div class="stat-joma">মোট জমা: ৳ 0.0</div>
                    <div class="stat-jer">মোট জের: ৳ 0.0</div>
                </div>
            </div>

            <div class="card">
                <button class="main-btn btn-sale" onclick="alert('তালিকা লোড হচ্ছে...')">বিক্রয়ের হিসাব</button>
                <div class="stats">
                    <div class="stat-joma">মোট জমা: ৳ 0.0</div>
                    <div class="stat-jer">মোট জের: ৳ 0.0</div>
                </div>
            </div>
        </div>
    </div>

<script>
    function doLogin() {
        const code = document.getElementById('scCode').value;
        // কোড এখানে চেক করা হচ্ছে
        if (code === "998877") {
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
        } else {
            alert("ভুল কোড! সঠিক কোডটি দিন।");
        }
    }
</script>
</body>
</html>
