<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মেসার্স সাগর ফিস</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { margin: 0; background: #f0f2f5; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 320px; }
        h2 { color: #1a73e8; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; text-align: center; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #main-content { display: none; padding: 20px; text-align: center; width: 100%; }
        .dashboard-item { background: white; padding: 15px; margin: 10px auto; border-radius: 8px; max-width: 400px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <div id="login-area" class="login-box">
        <h2>মেসার্স সাগর ফিস</h2>
        <input type="password" id="pin" placeholder="পিন কোড দিন">
        <button onclick="login()">প্রবেশ করুন</button>
    </div>

    <div id="main-content">
        <h2 style="color: #fff; background: #1a73e8; padding: 15px; margin: -20px -20px 20px -20px;">মেসার্স সাগর ফিস ড্যাশবোর্ড</h2>
        <div class="dashboard-item">আজকের জমা: ৳ ০.০০</div>
        <div class="dashboard-item">আজকের খরচ: ৳ ০.০০</div>
        <button onclick="location.reload()" style="max-width: 200px; margin-top: 20px; background: #666;">লগ আউট</button>
    </div>

    <script>
        function login() {
            const pin = document.getElementById('pin').value;
            if(pin === "sagorfish") { // পিন পরিবর্তন করতে পারেন
                document.getElementById('login-area').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                document.body.style.display = 'block';
                document.body.style.background = '#f0f2f5';
            } else {
                alert("ভুল পিন!");
            }
        }
    </script>
</body>
</html>
