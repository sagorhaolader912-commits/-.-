<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মেসার্স সাগর ফিস</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; text-align: center; background-color: #f4f7f6; margin: 0; padding: 15px; }
        .login-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); display: inline-block; margin-top: 50px; width: 90%; max-width: 380px; }
        h2 { color: #1a73e8; margin-bottom: 20px; }
        input { width: 85%; padding: 12px; margin: 15px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; outline: none; }
        .btn { padding: 12px 25px; background: #1a73e8; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; margin: 5px; }
        .btn-tabs { background: #34a853; width: 46%; margin-top: 10px; font-size: 15px; }
        .btn-logout { background: #dc3545; margin-top: 25px; font-size: 14px; padding: 8px 15px; }
        #dashboard { display: none; width: 100%; max-width: 1200px; margin: 0 auto; }
        iframe { width: 100%; height: 750px; border: 2px solid #ddd; border-radius: 12px; margin-top: 20px; }
        .header-bar { background: #1a73e8; color: white; padding: 15px; border-radius: 10px; margin-bottom: 25px; }
    </style>
</head>
<body>

    <div id="login-area" class="login-card">
        <h2>মেসার্স সাগর ফিস</h2>
        <p>সঠিক পাসওয়ার্ড দিয়ে প্রবেশ করুন</p>
        <input type="password" id="passInput" placeholder="পাসওয়ার্ড লিখুন"> <br>
        <button class="btn" onclick="login()">প্রবেশ করুন</button>
    </div>

    <div id="dashboard">
        <div class="header-bar">
            <h2 style="color: white; margin:0;">মেসার্স সাগর ফিস - ডিজিটাল খাতা</h2>
        </div>
        
        <div style="margin-bottom: 15px;">
            <button class="btn btn-tabs" onclick="changeTab('arat')">আড়ৎ এর হিসাব</button>
            <button class="btn btn-tabs" onclick="changeTab('bikroy')">বিক্রয়ের হিসাব</button>
        </div>

        <iframe id="sheetFrame" src="আপনার_গুগল_শিটের_লিঙ্ক"></iframe>
        
        <br>
        <button class="btn btn-logout" onclick="location.reload()">লগ আউট</button>
    </div>

    <script>
        // আপনার গুগল শিটের সঠিক শেয়ার লিঙ্কটি এখানে দিন
        var mySheetLink = "আপনার_গুগল_শিটের_লিঙ্ক";

        function login() {
            var pass = document.getElementById("passInput").value;
            if(pass === "sagar123") {
                document.getElementById("login-area").style.display = "none";
                document.getElementById("dashboard").style.display = "block";
            } else {
                alert("ভুল পাসওয়ার্ড!");
            }
        }

        function changeTab(tab) {
            var frame = document.getElementById("sheetFrame");
            if(tab === 'arat') {
                frame.src = mySheetLink; // আড়ৎ এর হিসাব
            } else {
                // বিক্রয়ের হিসাবের জন্য যদি শিটের আলাদা ট্যাব থাকে, তবে সেই লিঙ্কটি দিন
                frame.src = mySheetLink; 
            }
        }
    </script>
</body>
</html>
