<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>মেসার্স সাগর ফিস</title>
    <style>
        /* Agur stylish design gulo thakbe */
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: #f0f2f5; font-family: Arial, sans-serif; }
        .header { background: #1a73e8; color: white; padding: 15px; text-align: center; font-size: 24px; font-weight: bold; position: relative; }
        
        .menu-area { padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        
        /* Button Container Styling */
        .btn-box {
            background: white;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }

        .btn { padding: 18px; border: none; border-radius: 12px; font-weight: bold; color: white; font-size: 18px; cursor: pointer; width: 100%; }
        .btn-green { background: #28a745; }
        .btn-pink { background: #e91e63; }

        /* Shortcut Summary Styling */
        .summary-text {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }
        .summary-text span { color: #d32f2f; } /* Jer er jonno lal rong */
        .joma-text { color: #1b5e20 !important; } /* Joma r jonno shobuj */
    </style>
</head>
<body>

    <div class="header">মেসার্স সাগর ফিস</div>

    <div id="home-screen" class="menu-area">
        <div class="btn-box">
            <button class="btn btn-green" onclick="goToList('Arat')">আড়ৎ এর হিসাব</button>
            <div class="summary-text">
                <div>মোট জমা: <span class="joma-text">৳ ৫,৫০,০০০</span></div>
                <div>মোট জের: <span>৳ ১,২০,০০০</span></div>
            </div>
        </div>

        <div class="btn-box">
            <button class="btn btn-pink" onclick="goToList('Company')">বিক্রয়ের হিসাব</button>
            <div class="summary-text">
                <div>মোট জমা: <span class="joma-text">৳ ২,১০,০০০</span></div>
                <div>মোট জের: <span>৳ ৪৫,০০০</span></div>
            </div>
        </div>

        <button class="btn" style="background: #6c757d; margin-top: 20px;" onclick="location.reload()">লগ আউট</button>
    </div>

</body>
</html>
