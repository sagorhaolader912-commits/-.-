<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>মেসার্স সাগর ফিস</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; background-color: #f0f2f5; overflow: hidden; }
        .container { max-width: 800px; margin: auto; background: white; height: 100vh; display: flex; flex-direction: column; }
        .header { background: #1a73e8; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; }
        
        /* ডানে-বামে সরানোর কন্টেইনার */
        .scroll-wrapper {
            overflow-x: auto; /* ডানে-বামে সরানোর জন্য */
            overflow-y: hidden;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        /* হেডলাইন ডিজাইন - যা গুগল শিটের সাথে মিলবে */
        .fixed-header-row {
            display: flex;
            background: #1a73e8;
            color: white;
            font-size: 14px;
            font-weight: bold;
            min-width: 600px; /* গুগল শিটের কলামের সাথে মিল রাখতে */
            padding: 10px 0;
            border-bottom: 2px solid #fff;
        }
        .fixed-header-row div {
            width: 100px; /* প্রতিটি বক্সের সমান চওড়া */
            text-align: center;
            border-right: 1px solid rgba(255,255,255,0.3);
        }

        /* গুগল শিটের এরিয়া */
        .tali-table-container {
            flex-grow: 1;
            min-width: 600px; /* হেডলাইনের সমান রাখতে হবে */
            background: #fff;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .btn-main { padding: 18px; width: 90%; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; margin: 10px auto; color: white; background: #28a745; font-size: 16px; display: block; }
        .back-btn { background: #6c757d !important; width: 100%; margin: 0; border-radius: 0; }

        #app-content, #sub-menu, #tali-khata-page { display: none; flex-direction: column; height: 100%; }
        .item-list { overflow-y: auto; flex-grow: 1; padding: 10px; }
        .item-row { padding: 15px; background: #f8f9fa; border: 1px solid #ddd; margin-bottom: 5px; border-radius: 8px; text-align: left; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div id="step1" style="padding-top: 50px;">
        <div class="header">মেসার্স সাগর ফিস</div>
        <input type="password" id="passInput" style="width: 80%; padding: 12px; margin: 20px auto; display: block; text-align: center;" placeholder="পাসওয়ার্ড">
        <button class="btn-main" onclick="checkPassword()">পরবর্তী</button>
    </div>

    <div id="app-content">
        <div id="home-menu" style="display: block;">
            <div class="header">প্রধান মেনু</div>
            <button class="btn-main" onclick="showMenu('Arat')">আড়ৎ এর হিসাব</button>
            <button class="btn-main" style="background:#e91e63" onclick="showMenu('Company')">বিক্রয়ের হিসাব</button>
        </div>

        <div id="sub-menu">
            <div class="header">তালিকা</div>
            <div id="dynamic-buttons" class="item-list"></div>
            <button class="btn-main back-btn" onclick="goHome()">← ফিরে যান</button>
        </div>

        <div id="tali-khata-page">
            <div class="header" id="tali-title">খাতা</div>
            
            <div class="scroll-wrapper">
                <div class="fixed-header-row">
                    <div>তারিখ</div>
                    <div>ওজন</div>
                    <div>দর</div>
                    <div>মোট টাকা</div>
                    <div>জমা</div>
                    <div>জের</div>
                </div>

                <div class="tali-table-container">
                    <iframe id="sheetFrame" src=""></iframe>
                </div>
            </div>

            <button class="btn-main back-btn" onclick="closeTali()">← তালিকায় ফিরুন</button>
        </div>
    </div>
</div>

<script>
    const MAIN_PASSWORD = "sagar"; 
    const MY_SHEET_URL = "https://docs.google.com/spreadsheets/d/10VFHqozMCUa6GlVzraUAloLex-NAHijfwfBl4rBHFSY/edit?rm=minimal";

    function checkPassword() {
        if(document.getElementById('passInput').value === MAIN_PASSWORD) {
            document.getElementById('step1').style.display = 'none';
            document.getElementById('app-content').style.display = 'flex';
        } else { alert("ভুল পাসওয়ার্ড!"); }
    }

    const savedNames = {
        'Arat': Array.from({length: 120}, (_, i) => `আড়ৎ ${i + 1}`),
        'Company': Array.from({length: 20}, (_, i) => `কোম্পানি ${i + 1}`)
    };

    function showMenu(type) {
        document.getElementById('home-menu').style.display = 'none';
        document.getElementById('sub-menu').style.display = 'flex';
        const container = document.getElementById('dynamic-buttons');
        container.innerHTML = "";
        savedNames[type].forEach((name) => {
            const row = document.createElement('div');
            row.className = 'item-row';
            row.innerText = name;
            row.onclick = () => openTaliKhata(name);
            container.appendChild(row);
        });
    }

    function openTaliKhata(name) {
        document.getElementById('sub-menu').style.display = 'none';
        document.getElementById('tali-khata-page').style.display = 'flex';
        document.getElementById('tali-title').innerText = name;
        document.getElementById('sheetFrame').src = MY_SHEET_URL;
    }

    function closeTali() {
        document.getElementById('tali-khata-page').style.display = 'none';
        document.getElementById('sub-menu').style.display = 'flex';
        document.getElementById('sheetFrame').src = "";
    }

    function goHome() {
        document.getElementById('sub-menu').style.display = 'none';
        document.getElementById('home-menu').style.display = 'block';
    }
</script>
</body>
</html>
