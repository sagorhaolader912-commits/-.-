<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মেসার্স সাগর ফিস</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { margin: 0; background: #f0f2f5; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 320px; }
        h2 { color: #1a73e8; margin-bottom: 20px; }
        input[type="password"], input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; text-align: center; font-size: 16px; outline: none; }
        .show-pass-area { margin-top: 10px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #555; cursor: pointer; }
        .show-pass-area input { margin-right: 8px; cursor: pointer; }
        button { width: 100%; padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>মেসার্স সাগর ফিস</h2>
        <input type="password" id="pinInput" placeholder="পিন কোড দিন">
        
        <label class="show-pass-area">
            <input type="checkbox" onclick="togglePassword()"> পিন দেখুন
        </label>

        <button onclick="checkLogin()">প্রবেশ করুন</button>
    </div>

    <script>
        function togglePassword() {
            var x = document.getElementById("pinInput");
            if (x.type === "password") {
                x.type = "text";
            } else {
                x.type = "password";
            }
        }

        function checkLogin() {
            const pin = document.getElementById('pinInput').value;
            // নতুন পিন: 2026
            if(pin === "2026") {
                alert("লগইন সফল! মেসার্স সাগর ফিস ড্যাশবোর্ডে আপনাকে স্বাগতম।");
            } else {
                alert("ভুল পিন! দয়া করে সঠিক পিন দিন।");
            }
        }
    </script>
</body>
</html>
