<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>মেসার্স সাগর ফিস</title>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #f4f6f9; font-family: Arial, sans-serif; }
        
        /* ছোট লগইন বক্স */
        #login-page { position: fixed; inset: 0; background: white; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .login-box { width: 240px; padding: 20px; text-align: center; border: 1px solid #ddd; border-radius: 10px; }
        .site-name { color: #1a73e8; font-size: 18px; font-weight: bold; margin-bottom: 15px; }
        .login-input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; text-align: center; }
        .login-btn { width: 100%; padding: 10px; border: none; border-radius: 5px; background: #28a745; color: white; font-weight: bold; cursor: pointer; }

        /* মেইন অ্যাপ */
        #main-app { display: none; height: 100vh; flex-direction: column; }
        .header { background: #1a73e8; color: white; padding: 12px; text-align: center; font-size: 19px; font-weight: bold; position: relative; }
        .back-btn { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); background: #28a745; color: white; padding: 4px 10px; border-radius: 5px; display: none; border: none; }

        .menu-area { padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .btn-container { background: white; padding: 15px; border-radius: 12px; border: 1px solid #ddd; width: 85%; max-width: 340px; text-align: center; }
        .btn { padding: 14px; border: none; border-radius: 10px; font-weight: bold; color: white; font-size: 17px; width: 100%; }
        .btn-green { background: #28a745; }
        .btn-pink { background: #e91e63; }
        
        /* জমা ও জের - বড় লেখা */
        .shortcut-stats { display: flex; justify-content: space-around; margin-top: 15px; font-size: 18px; font-weight: 900; color: #000; }
        .stat-joma { color: #1b5e20; } 
        .stat-jer { color: #b71c1c; }  

        .list-container { flex-grow: 1; overflow-y: auto; padding: 12px; display: none; }
        .item-card { padding: 15px; background: #fff; border: 1px solid #eee; margin-bottom: 8px; border-radius: 10px; font-weight: bold; text-align: center; }
        .sheet-container { flex-grow: 1; display: none; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="login-page">
        <div class="login-box">
            <div class="site-name">মেসার্স সাগর ফিস</div>
            <div id="step1">
                <input type="password" id="passInput" class="login-input" placeholder="পাসওয়ার্ড">
                <button class="login-btn" onclick="checkPass()">পরবর্তী</button>
            </div>
            <div id="step2" style="display: none;">
                <input type="number" id="codeInput" class="login-input" placeholder="কোড">
                <button class="login-btn" style="background: #1a73e8;" onclick="checkCode()">লগইন</button>
            </div>
        </div>
    </div>

    <div id="main-app">
        <div class="header">
            <button id="backIcon" class="back-btn" onclick="handleBack()">←</button>
            <span id="topTitle">মেসার্স সাগর ফিস</span>
        </div>

        <div id="home-screen" class="menu-area">
            <div class="btn-container">
                <button class="btn btn-green" onclick="showList('Arat')">আড়ৎ এর হিসাব</button>
                <div class="shortcut-stats">
                    <span>জমা: <span class="stat-joma">৳ 0.0</span></span>
                    <span>জের: <span class="stat-jer">৳ 0.0</span></span>
                </div>
            </div>

            <div class="btn-container">
                <button class="btn btn-pink" onclick="showList('Company')">বিক্রয়ের হিসাব</button>
                <div class="shortcut-stats">
                    <span>জমা: <span class="stat-joma">৳ 0.0</span></span>
                    <span>জের: <span class="stat-jer">৳ 0.0</span></span>
                </div>
            </div>
        </div>

        <div id="list-screen" class="list-container"><div id="list-items"></div></div>
        <div id="sheet-screen" class="sheet-container"><iframe id="sheetFrame"></iframe></div>
    </div>

<script>
    const P = "sagar";
    const C = "998877";

    function checkPass() {
        if(document.getElementById('passInput').value === P) {
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
        } else { alert("ভুল!"); }
    }

    function checkCode() {
        if(document.getElementById('codeInput').value === C) {
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
        } else { alert("ভুল কোড!"); }
    }

    function showList(type) {
        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('list-screen').style.display = 'block';
        document.getElementById('backIcon').style.display = 'block';
        document.getElementById('topTitle').innerText = "তালিকা";
        let container = document.getElementById('list-items');
        container.innerHTML = "";
        let total = (type === 'Arat' ? 120 : 20);
        for (let i = 1; i <= total; i++) {
            let div = document.createElement('div');
            div.className = 'item-card';
            div.innerText = (type === 'Arat' ? "আড়ৎ " : "কোম্পানি ") + i;
            div.onclick = function() {
                document.getElementById('list-screen').style.display = 'none';
                document.getElementById('sheet-screen').style.display = 'block';
                document.getElementById('sheetFrame').src = "https://docs.google.com/spreadsheets/d/10VFHqozMCUa6GlVzraUAloLex-NAHijfwfBl4rBHFSY/edit?rm=minimal";
            };
            container.appendChild(div);
        }
    }

    function handleBack() {
        if (document.getElementById('sheet-screen').style.display === 'block') {
            document.getElementById('sheet-screen').style.display = 'none';
            document.getElementById('list-screen').style.display = 'block';
        } else {
            document.getElementById('list-screen').style.display = 'none';
            document.getElementById('home-screen').style.display = 'flex';
            document.getElementById('backIcon').style.display = 'none';
        }
    }
</script>
</body>
</html>
