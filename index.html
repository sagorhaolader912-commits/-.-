<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মেসার্স সাগর ফিস</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; background-color: #f0f2f5; margin: 0; padding: 10px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 15px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); min-height: 95vh; }
        .header { background: #1a73e8; color: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        
        /* Menu & Buttons */
        .btn-main { padding: 18px; width: 95%; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; margin: 8px; color: white; background: #28a745; font-size: 16px; }
        .search-box { width: 90%; padding: 12px; margin-bottom: 15px; border: 2px solid #1a73e8; border-radius: 10px; outline: none; }
        .btn-list { display: flex; flex-direction: column; gap: 8px; max-height: 400px; overflow-y: auto; padding: 5px; }
        .item-row { display: flex; align-items: center; background: #ffffff; border-radius: 10px; border: 1px solid #dfe1e5; margin-bottom: 5px; }
        .item-name { flex-grow: 1; padding: 15px; border: none; background: none; font-weight: 600; text-align: left; cursor: pointer; font-size: 15px; }
        .three-dot { padding: 10px 20px; background: none; border: none; border-left: 1px solid #f1f3f4; cursor: pointer; font-size: 20px; color: #555; }

        /* Digital Tali Khata Design */
        .tali-table-container { display: none; margin-top: 10px; border: 2px solid #1a73e8; border-radius: 10px; overflow: hidden; background: #fff; }
        .tali-header { display: grid; grid-template-columns: 1fr 1fr 0.8fr 0.8fr 0.8fr 0.8fr; background: #1a73e8; color: white; font-size: 10px; font-weight: bold; padding: 12px 2px; }
        .tali-header div { border-right: 1px solid #ffffff55; }
        
        iframe { width: 100%; height: 500px; border: none; background: #fff; }
        .back-btn { background: #6c757d !important; margin-top: 10px; width: 100%; }
        
        #step2, #app-content { display: none; }
        input[type="password"], input[type="number"] { width: 85%; padding: 12px; margin: 10px 0; border: 2px solid #ddd; border-radius: 8px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div id="step1">
        <div class="header"><h3>মেসার্স সাগর ফিস</h3></div>
        <input type="password" id="passInput" placeholder="পাসওয়ার্ড দিন">
        <button class="btn-main" onclick="checkPassword()">পরবর্তী ধাপ</button>
    </div>
    
    <div id="step2">
        <div class="header"><h3>নিরাপত্তা যাচাই</h3></div>
        <input type="number" id="twoFactorInput" placeholder="৬ ডিজিট কোড">
        <button class="btn-main" onclick="verifyCode()">লগইন করুন</button>
    </div>

    <div id="app-content">
        <div id="home-menu">
            <div class="header"><h1>মেসার্স সাগর ফিস</h1></div>
            <button class="btn-main" onclick="showMenu('Arat')">আড়ৎ এর হিসাব (১২০)</button>
            <button class="btn-main" style="background:#e91e63" onclick="showMenu('Company')">বিক্রয়ের হিসাব (২০)</button>
            <button class="btn-main" style="background:#6c757d" onclick="location.reload()">লগ আউট</button>
        </div>

        <div id="sub-menu" style="display:none;">
            <h3 id="menu-title" style="color:#1a73e8;">তালিকা</h3>
            <input type="text" id="searchInput" class="search-box" placeholder="নাম লিখে খুঁজুন..." onkeyup="filterList()">
            <div id="dynamic-buttons" class="btn-list"></div>
            <button class="btn-main back-btn" onclick="goHome()">← পেছনে যান</button>
        </div>

        <div id="tali-khata-page" style="display:none;">
            <div class="header" style="padding: 10px;"><h2 id="tali-title" style="margin:0;">খাতা</h2></div>
            
            <div class="tali-table-container" id="tableHeader" style="display:block;">
                <div class="tali-header">
                    <div>তারিখ</div>
                    <div>সাইজ</div>
                    <div>দর</div>
                    <div>মোট</div>
                    <div>জমা</div>
                    <div>জের</div>
                </div>
                <iframe id="sheetFrame" src=""></iframe>
            </div>
            
            <button class="btn-main back-btn" onclick="closeTali()">← তালিকা মেনুতে ফিরুন</button>
        </div>
    </div>
</div>
