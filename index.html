<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>মেসার্স সাগর ফিস</title>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100vh; background: #f4f6f9; font-family: Arial, sans-serif; }
        
        /* লগইন ডিজাইন - একদম সিম্পল */
        #login-area { position: fixed; inset: 0; background: white; z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .box { width: 260px; padding: 30px; border: 1px solid #ddd; border-radius: 15px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .title { color: #1a73e8; font-size: 20px; font-weight: bold; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; text-align: center; font-size: 16px; }
        .go-btn { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* মেইন বডি */
        #main-app { display: none; }
        .header { background: #1a73e8; color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 18px; }
        
        .menu-list { display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 20px; }
        .card { background: white; width: 90%; max-width: 350px; padding: 20px; border-radius: 15px; text-align: center; border: 1px solid #eee; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; color: white; font-weight: bold; font-size: 18px; margin-bottom: 10px; }
        .btn-green { background: #28a745; }
        .btn-pink { background: #e91e63; }

        /* জমা ও জের - ছোট ফন্ট */
        .stats { font-size: 13px; font-weight: 600; line-height: 1.6; }
        .stat-joma { color: #2e7d32; display: block; }
        .stat-jer { color: #c62828; display: block; }
    </style>
</head>
<body>

    <div id="login-area">
        <div class="box">
            <div class="title">মেসার্স সাগর ফিস</div>
            <input type="password" id="pass" placeholder="পাসওয়ার্ড লিখুন">
            <input type="number" id="code" placeholder="কোড লিখুন">
            <button class="go-btn" onclick="checkNow()">লগইন</button>
        </div>
    </div>

    <div id="main-app">
        <div class="header">মেসার্স সাগর ফিস</div>
        <div class="menu-list">
            <div class="card">
                <button class="btn btn-green">আড়ৎ এর হিসাব</button>
                <div class="stats">
                    <span class="stat-joma">মোট জমা: ৳ 0.0</span>
                    <span class="stat-jer">মোট জের: ৳ 0.0</span>
                </div>
            </div>
            <div class="card">
                <button class="btn btn-pink">বিক্রয়ের হিসাব</button>
                <div class="stats">
                    <span class="stat-joma">মোট জমা: ৳ 0.0</span>
                    <span class="stat-jer">মোট জের: ৳ 0.0</span>
                </div>
            </div>
        </div>
    </div>

<script>
    function checkNow() {
        const p = document.getElementById('pass').value;
        const c = document.getElementById('code').value;

        // চেক করার সময় কোনো ভুল যাতে না হয় তাই String() করা হয়েছে
        if (p === "sagar" && String(c) === "998877") {
            document.getElementById('login-area').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
        } else {
            alert("ভুল তথ্য! পাসওয়ার্ড: sagar এবং কোড: 998877 দিন।");
        }
    }
</script>
</body>
</html>
