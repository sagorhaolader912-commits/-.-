<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>মেসার্স সাগর ফিস</title>
    <style>
        /* পুরো স্ক্রিনকে লক করে রাখা */
        html, body { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%; 
            overflow: hidden; 
            background-color: #f0f2f5; 
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .container { 
            height: 100%; 
            width: 100%; 
            max-width: 800px; 
            margin: auto; 
            background: white; 
            display: flex; 
            flex-direction: column;
            position: relative;
        }

        .header { background: #1a73e8; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; flex-shrink: 0; }

        /* লগইন স্ক্রিন ডিজাইন */
        #login-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: white;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* প্রধান মেনু এবং লিস্ট এরিয়া */
        #app-content, #sub-menu, #tali-khata-page { 
            display: none; 
            flex-direction: column; 
            height: 100%; 
            width: 100%;
        }

        /* স্ক্রল এরিয়া সেটিংস */
        .scroll-wrapper { 
            flex-grow: 1; 
            overflow-x: auto; 
            overflow-y: hidden; 
            display: flex; 
            flex-direction: column;
            background: #fff;
        }

        .fixed-header-row { 
            display: flex; 
            background: #0d47a1; 
            color: white; 
            font-size: 13px; 
            font-weight: bold; 
            min-width: 600px; 
            padding: 12px 0;
            flex-shrink: 0;
        }
        .fixed-header-row div { width: 100px; text-align: center; border-right: 1px solid rgba(255,255,255,0.2); }

        .tali-table-container { flex-grow: 1; min-width: 600px; height: 100%; }
        iframe { width: 100%; height: 100%; border: none; }

        /* বাটন ডিজাইন */
        .btn-main { padding: 18px; width: 85%; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; margin: 10px auto; color: white; background: #28a745; font-size: 17px; }
        .back-btn { background: #6c757d !important; width: 100%; margin: 0; border-radius: 0; padding: 15px; flex-shrink: 0; }

        .item-list { overflow-y: auto; flex-grow: 1; padding: 15px; }
        .item-row { padding: 15px; background: #f8f9fa; border: 1px solid #ddd; margin-bottom: 8px; border-radius: 10px; font-weight: bold; text-align: left; }
        
        input { width: 80%; padding: 15px; margin: 20px 0; border: 2px solid #ddd; border-radius: 10px; text-align: center; font-size: 16px; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-screen">
        <div class="header" style="width: 100%; position: absolute; top: 0;">মেসার্স সাগর ফিস</div>
        <input type="password" id="passInput" placeholder="সিকিউরিটি পাসওয়ার্ড">
        <button class="btn-main" onclick="checkPassword()">লগইন করুন</button>
    </div>

    <div id="app-content">
        <div id="home-menu" style="display: flex; flex-direction: column; height: 100%;">
            <div class="header">মেসার্স সাগর ফিস</div>
            <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center;">
                <button class="btn-main" onclick="showMenu('Arat')">আড়ৎ এর হিসাব</button>
                <button class="btn-main" style="background:#e91e63" onclick="showMenu('Company')">বিক্রয়ের হিসাব</button>
                <button class="btn-main" style="background:#6c757d" onclick="location.reload()">লগ আউট</button>
            </div>
        </div>

        <div id="sub-menu">
            <div class="header" id="list-header">তালিকা</div>
            <div id="dynamic-buttons" class="item-list"></div>
            <button class="btn-main back-btn" onclick="goHome()">← ফিরে যান</button>
        </div>

        <div id="tali-khata-page">
            <div class="header" id="tali-title">খাতা</div>
            <div class="scroll-wrapper">
                <div class="fixed-header-row">
                    <div>তারিখ</div><div>ওজন</div><div>দর</div><div>মোট টাকা</div><div>জমা</div><div>জের</div>
                </div>
                <div class="tali-table-container">
                    <iframe id="sheetFrame" src=""></iframe>
                </div>
            </div>
            <button class="btn-main back-btn" onclick="closeTali()">← তালিকায় ফিরুন</button>
        </div>
    </div>
</div>

<script>
    const MAIN_PASSWORD = "sagar"; 
    const MY_SHEET_URL = "https://docs.google.com/spreadsheets/d/10VFHqozMCUa6GlVzraUAloLex-NAHijfwfBl4rBHFSY/edit?rm=minimal";

    function checkPassword() {
        if(document.getElementById('passInput').value === MAIN_PASSWORD) {
            // লগইন স্ক্রিনটি পুরোপুরি রিমুভ করে দেওয়া হচ্ছে
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-content').style.display = 'flex';
        } else { alert("ভুল পাসওয়ার্ড!"); }
    }

    const savedNames = {
        'Arat': Array.from({length: 120}, (_, i) => `আড়ৎ ${i + 1}`),
        'Company': Array.from({length: 20}, (_, i) => `কোম্পানি ${i + 1}`)
    };

    function showMenu(type) {
        document.getElementById('home-menu').style.display = 'none';
        document.getElementById('sub-menu').style.display = 'flex';
        document.getElementById('list-header').innerText = type === 'Arat' ? "আড়ৎ তালিকা" : "কোম্পানি তালিকা";
        const container = document.getElementById('dynamic-buttons');
        container.innerHTML = "";
        savedNames[type].forEach((name) => {
            const row = document.createElement('div');
            row.className = 'item-row';
            row.innerText = name;
            row.onclick = () => openTaliKhata(name);
            container.appendChild(row);
        });
    }

    function openTaliKhata(name) {
        document.getElementById('sub-menu').style.display = 'none';
        document.getElementById('tali-khata-page').style.display = 'flex';
        document.getElementById('tali-title').innerText = name;
        document.getElementById('sheetFrame').src = MY_SHEET_URL;
    }

    function closeTali() {
        document.getElementById('tali-khata-page').style.display = 'none';
        document.getElementById('sub-menu').style.display = 'flex';
        document.getElementById('sheetFrame').src = "";
    }

    function goHome() {
        document.getElementById('sub-menu').style.display = 'none';
        document.getElementById('home-menu').style.display = 'flex';
    }
</script>
</body>
</html>
