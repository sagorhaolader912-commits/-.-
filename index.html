<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>মেসার্স সাগর ফিস</title>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: #f4f6f9; font-family: Arial, sans-serif; }
        
        /* Chhoto Login Design */
        #login-page { 
            position: fixed; inset: 0; background: #fff; z-index: 9999; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
        }
        .login-box { 
            width: 250px; padding: 20px; text-align: center; border: 1px solid #eee; 
            border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .site-name { color: #1a73e8; font-size: 18px; font-weight: bold; margin-bottom: 15px; }
        .login-input { 
            width: 100%; height: 38px; padding: 8px; margin-bottom: 12px; 
            border: 1px solid #ddd; border-radius: 5px; text-align: center; font-size: 14px; 
        }
        .login-btn { 
            width: 100%; height: 38px; border: none; border-radius: 5px; 
            background: #28a745; color: white; font-weight: bold; cursor: pointer; 
        }

        /* Main Application */
        #main-app { display: none; height: 100%; flex-direction: column; }
        .header { background: #1a73e8; color: white; padding: 12px; text-align: center; font-size: 19px; font-weight: bold; position: relative; }
        .back-btn { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); background: #28a745; color: white; padding: 4px 10px; border-radius: 5px; display: none; border: none; font-size: 14px; }

        .menu-area { padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 15px; flex-grow: 1; }
        .btn-container { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 3px 6px rgba(0,0,0,0.08); border: 1px solid #e0e4e8; width: 85%; max-width: 340px; text-align: center; }
        .btn { padding: 14px; border: none; border-radius: 10px; font-weight: bold; color: white; font-size: 17px; cursor: pointer; width: 100%; }
        .btn-green { background: #28a745; }
        .btn-pink { background: #e91e63; }
        .btn-gray { padding: 10px; background: #6c757d; font-size: 14px; margin-top: auto; margin-bottom: 25px; width: 85%; border-radius: 8px; color: white; border: none; }

        /* Joma o Jer - Boro o Shposhto */
        .shortcut-stats { display: flex; justify-content: space-around; margin-top: 15px; font-size: 17px; font-weight: 900; color: #000; }
        .stat-joma { color: #1b5e20; } 
        .stat-jer { color: #b71c1c; }  

        /* List Area */
        .list-container { flex-grow: 1; overflow-y: auto; padding: 12px; display: none; }
        .item-card { padding: 15px; background: #fff; border: 1px solid #eee; margin-bottom: 8px; border-radius: 10px; font-weight: bold; text-align: center; font-size: 15px; }

        .sheet-container { flex-grow: 1; display: none; flex-direction: column; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="login-page">
        <div class="login-box">
            <div class="site-name">মেসার্স সাগর ফিস</div>

                <input type="password" id="passInput" class="login-input" placeholder="পাসওয়ার্ড">
                <button class="login-btn" onclick="checkPass()">পরবর্তী</button>
            </div>
