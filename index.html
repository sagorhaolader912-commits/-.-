<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>মেসার্স সাগর ফিস</title>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: #f4f6f9; font-family: Arial, sans-serif; }
        
        /* একদম ছোট লগইন পেজ */
        #login-page { 
            position: fixed; inset: 0; background: #fff; z-index: 9999; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
        }
        .site-name { color: #1a73e8; font-size: 22px; font-weight: bold; margin-bottom: 15px; }
        
        /* ইনপুট বক্স আরও ছোট করা হয়েছে */
        .login-input { 
            width: 60%; max-width: 220px; padding: 10px; margin-bottom: 12px; 
            border: 1px solid #ddd; border-radius: 6px; text-align: center; font-size: 14px; 
        }
        .login-btn { 
            width: 60%; max-width: 220px; padding: 10px; border: none; 
            border-radius: 6px; background: #28a745; color: white; 
            font-weight: bold; cursor: pointer; font-size: 14px;
        }

        /* মেইন অ্যাপ্লিকেশন এরিয়া */
        #main-app { display: none; height: 100%; flex-direction: column; }
        .header { background: #1a73e8; color: white; padding: 12px; text-align: center; font-size: 19px; font-weight: bold; position: relative; }
        .back-btn { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); background: #28a745; color: white; padding: 4px 10px; border-radius: 5px; display: none; border: none; font-size: 14px; }

        .menu-area { padding: 25px; display: flex; flex-direction: column; align-items: center; gap: 15px; flex-grow: 1; }
        .btn-container { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 3px 6px rgba(0,0,0,0.08); border: 1px solid #e0e4e8; width: 85%; max-width: 340px; text-align: center; }
        .btn { padding: 14px; border: none; border-radius: 10px; font-weight: bold; color: white; font-size: 17px; cursor: pointer; width: 100%; }
        .btn-green { background: #28a745; }
        .btn-pink { background: #e91e63; }
        .btn-gray { padding: 10px; background: #6c757d; font-size: 14px; margin-top: auto; margin-bottom: 25px; width: 85%; }

        .shortcut-stats { display: flex; justify-content: space-around; margin-top: 10px; font-size: 13px; font-weight: bold; color: #444; }
        .stat-joma { color: #2e7d32; } .stat-jer { color: #c62828; }  

        .list-container { flex-grow: 1; overflow-y: auto; padding: 12px; display: none; }
        .item-card { padding: 15px; background: #fff; border: 1px solid #eee; margin-bottom: 8px; border-radius: 10px; font-weight: bold; text-align: center; font-size: 15px; }

        .sheet-container { flex-grow: 1; display: none; flex-direction: column; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="login-page">
        <div class="site-name">মেসার্স সাগর ফিস</div>
        
        <div id="step1">
            <input type="password" id="passInput" class="login-input" placeholder="পাসওয়ার্ড">
            <button class="login-btn" onclick="checkPass()">পরবর্তী</button>
        </div>

        <div id="step2" style="display: none;">
            <input type="number" id="codeInput" class="login-input" placeholder="সিকিউরিটি কোড">
            <button class="login-btn" style="background: #1a73e8;" onclick="checkCode()">লগইন করুন</button>
        </div>
    </div>

    <div id="main-app">
        <div class="header">
            <button id="backIcon" class="back-btn" onclick="handleBack()">← ফিরে যান</button>
            <span id="topTitle">মেসার্স সাগর ফিস</span>
        </div>

        <div id="home-screen" class="menu-area">
            <div class="btn-container">
                <button class="btn btn-green" onclick="showList('Arat')">আড়ৎ এর হিসাব</button>
                <div class="shortcut-stats">
                    <span>জমা: <span class="stat-joma">৳ ....</span></span>
                    <span>জের: <span class="stat-jer">৳ ....</span></span>
                </div>
            </div>

            <div class="btn-container">
                <button class="btn btn-pink" onclick="showList('Company')">বিক্রয়ের হিসাব</button>
                <div class="shortcut-stats">
                    <span>জমা: <span class="stat-joma">৳ ....</span></span>
                    <span>জের: <span class="stat-jer">৳ ....</span></span>
                </div>
            </div>
            <button class="btn btn-gray" onclick="location.reload()">লগ আউট</button>
        </div>

        <div id="list-screen" class="list-container">
            <div id="list-items"></div>
        </div>

        <div id="sheet-screen" class="sheet-container">
            <iframe id="sheetFrame" src=""></iframe>
        </div>
    </div>

<script>
    // সিকিউরিটি সেটআপ
    const PASS = "sagar";
    const CODE = "1234"; // এখানে আপনার পছন্দের কোড দিন
    const SHEET_URL = "https://docs.google.com/spreadsheets/d/10VFHqozMCUa6GlVzraUAloLex-NAHijfwfBl4rBHFSY/edit?rm=minimal";
    
    let currentState = "home";

    // ধাপ ১: পাসওয়ার্ড চেক
    function checkPass() {
        const val = document.getElementById('passInput').value;
        if (val === PASS) {
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
        } else {
            alert("ভুল পাসওয়ার্ড!");
        }
    }

    // ধাপ ২: কোড চেক
    function checkCode() {
        const val = document.getElementById('codeInput').value;
        if (val === CODE) {
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
        } else {
            alert("ভুল সিকিউরিটি কোড!");
        }
    }

    // মেনু এবং লিস্ট ফাংশন
    function showList(type) {
        currentState = "list";
        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('list-screen').style.display = 'block';
        document.getElementById('backIcon').style.display = 'block';
        document.getElementById('topTitle').innerText = (type === 'Arat' ? "আড়ৎ তালিকা" : "কোম্পানি তালিকা");
        const container = document.getElementById('list-items');
        container.innerHTML = "";
        const total = (type === 'Arat' ? 120 : 20);
        const prefix = (type === 'Arat' ? "আড়ৎ" : "কোম্পানি");
        for (let i = 1; i <= total; i++) {
            let div = document.createElement('div');
            div.className = 'item-card';
            div.innerText = prefix + " " + i;
            div.onclick = function() { openSheet(prefix + " " + i); };
            container.appendChild(div);
        }
    }

    function openSheet(name) {
        currentState = "sheet";
        document.getElementById('list-screen').style.display = 'none';
        document.getElementById('sheet-screen').style.display = 'flex';
        document.getElementById('topTitle').innerText = name;
        document.getElementById('sheetFrame').src = SHEET_URL;
    }

    function handleBack() {
        if (currentState === "sheet") {
            document.getElementById('sheet-screen').style.display = 'none';
            document.getElementById('list-screen').style.display = 'block';
            document.getElementById('sheetFrame').src = "";
            currentState = "list";
        } else if (currentState === "list") {
            document.getElementById('list-screen').style.display = 'none';
            document.getElementById('home-screen').style.display = 'flex';
            document.getElementById('backIcon').style.display = 'none';
            document.getElementById('topTitle').innerText = "মেসার্স সাগর ফিস";
            currentState = "home";
        }
    }
</script>
</body>
</html>
