<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>মেসার্স সাগর ফিস</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100vh; background: #f4f6f9; font-family: Arial, sans-serif; overflow: hidden; }
        
        /* লগইন এরিয়া */
        #login-area { position: fixed; inset: 0; background: white; z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .box { width: 85%; max-width: 320px; padding: 25px; border: 1px solid #ddd; border-radius: 15px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .login-input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 8px; text-align: center; font-size: 16px; display: block; outline: none; }
        
        .show-pass-label { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 15px; font-size: 14px; color: #555; cursor: pointer; user-select: none; }
        .go-btn { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }

        /* মেইন অ্যাপ */
        #main-app { display: none; flex-direction: column; height: 100vh; }
        .header { background: #1a73e8; color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 18px; position: relative; z-index: 101; }
        .back-btn { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); background: #28a745; color: white; padding: 6px 12px; border-radius: 6px; border: none; font-size: 14px; display: none; }
        
        .menu-list, #list-screen { padding: 20px; display: flex; flex-direction: column; gap: 15px; align-items: center; overflow-y: auto; flex-grow: 1; }
        .card { background: white; width: 100%; max-width: 350px; padding: 20px; border-radius: 15px; text-align: center; border: 1px solid #eee; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .btn { width: 100%; padding: 18px; border: none; border-radius: 12px; color: white; font-weight: bold; font-size: 18px; cursor: pointer; }
        .btn-green { background: #28a745; }
        .btn-pink { background: #e91e63; }

        #search-container { padding: 10px; background: #fff; border-bottom: 1px solid #eee; display: none; }
        #globalSearch { width: 100%; padding: 12px; border: 2px solid #1a73e8; border-radius: 8px; font-size: 16px; }
        
        #list-screen { display: none; background: #fff; }
        .list-item { padding: 15px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; width: 100%; cursor: pointer; }
        
        /* এডিট শিট ফ্রেম */
        #sheet-screen { display: none; flex-grow: 1; position: relative; width: 100%; height: 100%; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="login-area">
        <div class="box">
            <h2 style="color:#1a73e8; margin-bottom:20px;">মেসার্স সাগর ফিস</h2>
            
            <input type="password" id="passIn" class="login-input" placeholder="পাসওয়ার্ড লিখুন">
            <input type="password" id="codeIn" class="login-input" placeholder="কোড লিখুন">
            
            <label class="show-pass-label">
                <input type="checkbox" onclick="togglePassView()"> Show Password
            </label>

            <button class="go-btn" onclick="checkFinalLogin()">লগইন করুন</button>
            <p style="font-size: 10px; color: #aaa; margin-top: 15px;">Final Secure Version 7.0</p>
        </div>
    </div>

    <div id="main-app">
        <div class="header">
            <button id="backIcon" class="back-btn" onclick="handleBack()">← back</
