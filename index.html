<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>মেসার্স সাগর ফিস</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100vh; background: #f4f6f9; font-family: Arial, sans-serif; overflow: hidden; }
        
        /* লগইন এরিয়া */
        #login-area { position: fixed; inset: 0; background: white; z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .box { width: 85%; max-width: 320px; padding: 25px; border: 1px solid #ddd; border-radius: 15px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .login-input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 8px; text-align: center; font-size: 16px; display: block; outline: none; }
        .show-pass-label { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 15px; font-size: 14px; color: #555; cursor: pointer; }
        .go-btn { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* মেইন অ্যাপ */
        #main-app { display: none; flex-direction: column; height: 100vh; }
        .header { background: #1a73e8; color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 18px; position: relative; z-index: 101; }
        .back-btn { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); background: #28a745; color: white; padding: 6px 12px; border-radius: 6px; border: none; font-size: 14px; }

        .menu-list, #list-screen { padding: 15px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; flex-grow: 1; }
        .card { background: white; padding: 20px; border-radius: 15px; text-align: center; border: 1px solid #eee; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .btn { width: 100%; padding: 18px; border: none; border-radius: 12px; color: white; font-weight: bold; font-size: 18px; cursor: pointer; }
        .btn-green { background: #28a745; }
        .btn-pink { background: #e91e63; }

        .list-item { background: white; padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; cursor: pointer; font-weight: bold; }
        
        #sheet-screen { display: none; flex-grow: 1; position: relative; width: 100%; height: 100%; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="login-area">
        <div class="box">
            <h2 style="color:#1a73e8; margin-bottom:20px;">মেসার্স সাগর ফিস</h2>
            <input type="password" id="passIn" class="login-input" placeholder="Password">
            <input type="password" id="codeIn" class="login-input" placeholder="Code">
            <label class="show-pass-label">
                <input type="checkbox" onclick="togglePass()"> Show Password
            </label>
            <button class="go-btn" onclick="loginCheck()">লগইন করুন</button>
            <p style="font-size: 10px; color: #aaa; margin-top: 15px;">Version 25.0 (Header Locked & 10 Years)</p>
        </div>
    </div>

    <div id="main-app">
        <div class="header">
            <button id="backIcon" class="back-btn" onclick="handleBack()" style="display:none;">← back</button>
            <span id="topTitle">মেসার্স সাগর ফিস</span>
        </div>

        <div id="home-screen" class="menu-list">
            <div class="card"><button class="btn btn-green" onclick="showYearList('আড়ৎ')">আড়ৎ এর হিসাব</button></div>
            <div class="card"><button class="btn btn-pink" onclick="showYearList('বিক্রয়')">বিক্রয়ের হিসাব</button></div>
        </div>

        <div id="list-screen"></div>
        <div id="sheet-screen"><iframe id="sheetFrame" src=""></iframe></div>
    </div>

<script>
    function togglePass() {
        var p = document.getElementById("passIn"), c = document.getElementById("codeIn");
        p.type = (p.type === "password") ? "text" : "password";
        c.type = (c.type === "password") ? "text" : "password";
    }

    function loginCheck() {
        var p = document.getElementById("passIn").value, c = document.getElementById("codeIn").value;
        if (p === "sagarfish" && c === "4321") {
            document.getElementById('login-area').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
        } else { alert("ভুল পাসওয়ার্ড!"); }
    }

    // আপনার শিট লিঙ্ক (এডিট মোড)
    const EDIT_URL = "https://docs.google.com/spreadsheets/d/1jMOhvqNJMWrGjrwm3DVylQl9tBRHqP3KOKJNzkHABls/edit?usp=sharing";

    function showYearList(type) {
        window.currentType = type;
        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('list-screen').style.display = 'flex';
        document.getElementById('backIcon').style.display = 'block';
        document.getElementById('topTitle').innerText = type + " - বছর";
        
        let container = document.getElementById('list-screen');
        container.innerHTML = "";
        // ২০২৬ থেকে ২০৩৫ পর্যন্ত ১০ বছর
        for (let year = 2026; year <= 2035; year++) {
            let div = document.createElement('div');
            div.className = 'list-item';
            div.innerHTML = `<span>Year: ${year}</span> ❯`;
            div.onclick = () => showDateList(year);
            container.appendChild(div);
        }
    }

    function showDateList(year) {
        let container = document.getElementById('list-screen');
        container.innerHTML = "";
        document.getElementById('topTitle').innerText = window.currentType + " - " + year;
        
        let date = new Date(year, 0, 1);
        while (date.getFullYear() === year) {
            let dStr = date.getDate() + "/" + (date.getMonth() + 1) + "/" + date.getFullYear();
            let div = document.createElement('div');
            div.className = 'list-item';
            div.innerHTML = `<span>${dStr}</span> ❯`;
            div.onclick = () => {
                document.getElementById('list-screen').style.display = 'none';
                document.getElementById('sheet-screen').style.display = 'block';
                document.getElementById('topTitle').innerText = dStr;
                document.getElementById('sheetFrame').src = EDIT_URL;
            };
            container.appendChild(div);
            date.setDate(date.getDate() + 1);
        }
    }

    function handleBack() {
        if (document.getElementById('sheet-screen').style.display === 'block') {
            document.getElementById('sheet-screen').style.display = 'none';
            document.getElementById('list-screen').style.display = 'flex';
        } else {
            document.getElementById('list-screen').style.display = 'none';
            document.getElementById('home-screen').style.display = 'flex';
            document.getElementById('backIcon').style.display = 'none';
            document.getElementById('topTitle').innerText = "মেসার্স সাগর ফিস";
        }
    }
</script>
</body>
</html>
