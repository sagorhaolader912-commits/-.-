<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মেসার্স সাগর ফিস - সিকিউর লগইন</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; background-color: #eef2f3; margin: 0; padding: 20px; }
        .login-box { max-width: 400px; margin: 50px auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .header { background: #1a73e8; color: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        input { width: 90%; padding: 12px; margin: 10px 0; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; text-align: center; }
        .btn-next { width: 95%; padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
        #step2, #app-content { display: none; }
        .error { color: red; font-weight: bold; margin-top: 10px; display: none; }
        
        /* অ্যাপ কন্টেন্ট স্টাইল আগের মতোই থাকবে */
        .btn-main { padding: 18px; width: 95%; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; margin: 8px; color: white; background: #28a745; }
        .btn-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-height: 400px; overflow-y: auto; padding: 10px; border: 1px solid #eee; }
        .btn-item { padding: 12px; border: 1px solid #ddd; border-radius: 8px; background: #e3f2fd; font-weight: bold; cursor: pointer; }
        iframe { width: 100%; height: 500px; border-radius: 10px; margin-top: 20px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="step1" class="login-box">
        <div class="header"><h3>মেসার্স সাগর ফিস</h3></div>
        <h4>পাসওয়ার্ড দিন</h4>
        <input type="password" id="passInput" placeholder="পাসওয়ার্ড লিখুন">
        <button class="btn-next" onclick="checkPassword()">পরবর্তী ধাপ</button>
        <p id="err1" class="error">ভুল পাসওয়ার্ড!</p>
    </div>

    <div id="step2" class="login-box">
        <div class="header"><h3>2-Step Verification</h3></div>
        <p>আপনার মোবাইলে পাঠানো ভেরিফিকেশন কোডটি দিন</p>
        <input type="number" id="twoFactorInput" placeholder="৬ ডিজিট কোড">
        <button class="btn-next" onclick="verifyCode()">ভেরিফাই করুন</button>
        <p id="err2" class="error">ভুল ভেরিফিকেশন কোড!</p>
    </div>

    <div id="app-content">
        <div class="header"><h1>মেসার্স সাগর ফিস</h1></div>
        <div id="home-menu">
            <button class="btn-main" onclick="showMenu('Arat')">আড়ৎ এর হিসাব</button>
            <button class="btn-main" style="background:#e91e63" onclick="showMenu('Company')">বিক্রয়ের হিসাব</button>
            <button class="btn-main" style="background:#6c757d" onclick="location.reload()">লগ আউট</button>
        </div>
        
        <div id="sub-menu" style="display:none;">
            <div id="dynamic-buttons" class="btn-list"></div>
            <button class="btn-next" style="background:#6c757d; margin-top:10px;" onclick="goHome()">পেছনে যান</button>
        </div>
        <iframe id="sheetFrame" src=""></iframe>
    </div>
</div>

<script>
    // এই কোডগুলো আপনি আপনার মতো করে সেট করবেন
    const MAIN_PASSWORD = "sagar"; // আপনার পাসওয়ার্ড
    const TWO_FACTOR_CODE = "998877"; // আপনার মোবাইলের জন্য নির্ধারিত সিক্রেট কোড

    const mySheetLink = "https://docs.google.com/spreadsheets/d/1BlbOrJsve7AjU9Yn9qze8k5qNcVeaKqI_HXXG42RKE/edit?usp=sharing";

    function checkPassword() {
        if(document.getElementById('passInput').value === MAIN_PASSWORD) {
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
        } else {
            document.getElementById('err1').style.display = 'block';
        }
    }

    function verifyCode() {
        if(document.getElementById('twoFactorInput').value === TWO_FACTOR_CODE) {
            document.getElementById('step2').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
        } else {
            document.getElementById('err2').style.display = 'block';
        }
    }

    // আগের রিনেম এবং মেনু ফাংশনগুলো এখানে থাকবে...
    let savedNames = JSON.parse(localStorage.getItem('sagarFishNames')) || {
        'Arat': Array.from({length: 120}, (_, i) => `আড়ৎ ${i + 1}`),
        'Company': Array.from({length: 20}, (_, i) => `কোম্পানি ${i + 1}`)
    };

    function showMenu(type) {
        document.getElementById('home-menu').style.display = 'none';
        document.getElementById('sub-menu').style.display = 'block';
        const container = document.getElementById('dynamic-buttons');
        container.innerHTML = ""; 
        savedNames[type].forEach((name, index) => {
            const btn = document.createElement('button');
            btn.className = 'btn-item';
            btn.innerText = name;
            btn.onclick = () => {
                const frame = document.getElementById('sheetFrame');
                frame.style.display = 'block';
                frame.src = mySheetLink + "&rm=minimal";
            };
            container.appendChild(btn);
        });
    }

    function goHome() {
        document.getElementById('home-menu').style.display = 'block';
        document.getElementById('sub-menu').style.display = 'none';
        document.getElementById('sheetFrame').style.display = 'none';
    }
</script>
</body>
</html>
