<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মেসার্স সাগর ফিস</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; background-color: #f0f4f8; margin: 0; padding: 10px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .header { background: #1a73e8; color: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        .btn-main { padding: 18px; width: 95%; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; margin: 8px; font-size: 18px; color: white; background: #28a745; transition: 0.3s; }
        .btn-main:active { transform: scale(0.95); }
        .search-box { width: 90%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ddd; font-size: 16px; display: none; }
        .btn-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; max-height: 450px; overflow-y: auto; padding: 5px; border: 1px solid #eee; border-radius: 10px; }
        .btn-item { padding: 12px; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; background: #ffffff; color: #333; font-weight: 500; font-size: 14px; }
        .btn-item:hover { background: #e3f2fd; border-color: #1a73e8; }
        .btn-back { background: #6c757d; width: 95%; margin-top: 15px; color: white; padding: 12px; border: none; border-radius: 8px; cursor: pointer; }
        iframe { width: 100%; height: 550px; border: 1px solid #ddd; border-radius: 10px; margin-top: 20px; display: none; }
        #sub-menu { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="margin:0;">মেসার্স সাগর ফিস</h1>
        <small>ডিজিটাল ড্যাশবোর্ড</small>
    </div>

    <div id="home-menu">
        <button class="btn-main" onclick="showSubMenu('Arat')">আড়ৎ এর হিসাব (১২০)</button>
        <button class="btn-main" style="background:#e91e63" onclick="showSubMenu('Company')">বিক্রয়ের হিসাব (২০)</button>
        <button class="btn-main" style="background:#f39c12" onclick="window.open('আপনার_গুগল_শিট_লিঙ্ক', '_blank')">✎ নাম/হিসাব এডিট করুন</button>
    </div>

    <div id="sub-menu">
        <h3 id="menu-title">তালিকা:</h3>
        <input type="text" id="searchInput" class="search-box" placeholder="নাম লিখে খুঁজুন..." onkeyup="filterNames()">
        <div id="dynamic-buttons" class="btn-list"></div>
        <button class="btn-back" onclick="goHome()">← প্রধান মেনুতে ফিরুন</button>
    </div>

    <iframe id="sheetFrame" src=""></iframe>
</div>

<script>
    const mySheetURL = "আপনার_গুগল_শিট_লিঙ্ক"; 

    // এখানে ১২০টি আড়ত এবং ২০টি কোম্পানির ডাটা জেনারেট হচ্ছে
    const myData = {
        'Arat': Array.from({length: 120}, (_, i) => `আড়ৎ ${i + 1}`),
        'Company': Array.from({length: 20}, (_, i) => `কোম্পানি ${i + 1}`)
    };

    function showSubMenu(type) {
        document.getElementById('home-menu').style.display = 'none';
        document.getElementById('sub-menu').style.display = 'block';
        document.getElementById('searchInput').style.display = 'block';
        document.getElementById('menu-title').innerText = type === 'Arat' ? "আড়ৎ নির্বাচন করুন (১২০টি):" : "কোম্পানি নির্বাচন করুন (২০টি):";
        
        const container = document.getElementById('dynamic-buttons');
        container.innerHTML = ""; 
        
        myData[type].forEach(name => {
            const btn = document.createElement('button');
            btn.className = 'btn-item';
            btn.innerText = name;
            btn.onclick = () => openSheet();
            container.appendChild(btn);
        });
    }

    function filterNames() {
        let input = document.getElementById('searchInput').value.toLowerCase();
        let btns = document.getElementsByClassName('btn-item');
        for (let btn of btns) {
            btn.style.display = btn.innerText.toLowerCase().includes(input) ? "block" : "none";
        }
    }

    function openSheet() {
        const frame = document.getElementById('sheetFrame');
        frame.style.display = 'block';
        frame.src = mySheetURL + "&rm=minimal";
        window.scrollTo(0, document.body.scrollHeight);
    }

    function goHome() {
        document.getElementById('home-menu').style.display = 'block';
        document.getElementById('sub-menu').style.display = 'none';
        document.getElementById('sheetFrame').style.display = 'none';
        document.getElementById('searchInput').value = "";
    }
</script>

</body>
</html>
