<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>মেসার্স সাগর ফিস</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { 
            margin: 0; padding: 0; height: 100vh; background: #f4f6f9; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            overflow-x: hidden; /* ডানে বামে নড়াচড়া বন্ধ */
        }
        
        /* লগইন এরিয়া */
        #login-area { position: fixed; inset: 0; background: white; z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .box { width: 90%; max-width: 300px; padding: 30px; border: 1px solid #ddd; border-radius: 15px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        input.login-input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; text-align: center; font-size: 16px; outline: none; }
        .go-btn { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }

        /* মেইন অ্যাপ */
        #main-app { display: none; flex-direction: column; height: 100vh; }
        .header { background: #1a73e8; color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 18px; position: sticky; top: 0; z-index: 100; }
        .back-btn { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); background: #28a745; color: white; padding: 6px 12px; border-radius: 6px; border: none; font-size: 14px; display: none; }
        
        .menu-list { padding: 20px; display: flex; flex-direction: column; gap: 20px; align-items: center; overflow-y: auto; }
        .card { background: white; width: 100%; max-width: 350px; padding: 20px; border-radius: 15px; text-align: center; border: 1px solid #eee; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .btn { width: 100%; padding: 18px; border: none; border-radius: 12px; color: white; font-weight: bold; font-size: 18px; cursor: pointer; }
        .btn-green { background: #28a745; }
        .btn-pink { background: #e91e63; }

        /* সার্চ ও লিস্ট */
        #search-container { padding: 10px; background: #fff; border-bottom: 1px solid #eee; display: none; }
        #globalSearch { width: 100%; padding: 12px; border: 2px solid #1a73e8; border-radius: 8px; font-size: 16px; outline: none; }
        
        #list-screen { display: none; overflow-y: auto; background: #fff; flex-grow: 1; }
        .list-item { padding: 15px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .item-text { font-weight: bold; color: #333; font-family: Arial; font-size: 16px; }

        /* শিট ভিউ */
        #sheet-screen { display: none; flex-grow: 1; -webkit-overflow-scrolling: touch; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="login-area">
        <div class="box">
            <h2 style="color:#1a73e8; margin-bottom:20px;">সাগর ফিস</h2>
            <input type="text" id="pass" class="login-input" placeholder="পাসওয়ার্ড (sagar)">
            <input type="number" id="code" class="login-input" placeholder="কোড (998877)">
            <button class="go-btn" onclick="checkNow()">লগইন</button>
        </div>
    </div>

    <div id="main-app">
        <div class="header">
            <button id="backIcon" class="back-btn" onclick="handleBack()">← back</button>
            <span id="topTitle">মেসার্স সাগর ফিস</span>
        </div>

        <div id="home-screen" class="menu-list">
            <div class="card">
                <button class="btn btn-green" onclick="showYearList('আড়ৎ')">আড়ৎ এর হিসাব</button>
            </div>
            <div class="card">
                <button class="btn btn-pink" onclick="showYearList('বিক্রয়')">বিক্রয়ের হিসাব</button>
            </div>
        </div>

        <div id="search-container">
            <input type="text" id="globalSearch" placeholder="তারিখ লিখুন (উদা: 10/1/2026)" onkeyup="filterItems()">
        </div>

        <div id="list-screen"></div>

        <div id="sheet-screen">
            <iframe id="sheetFrame" src=""></iframe>
        </div>
    </div>

<script>
    const P = "sagar", C = "998877";
    const sheetURL = "https://docs.google.com/spreadsheets/d/1jMOhvqNJMWrGjrwm3DVylQl9tBRHqP3KOKJNzkHABls/preview?rm=minimal";

    function checkNow() {
        let uPass = document.getElementById('pass').value.toLowerCase();
        let uCode = document.getElementById('code').value;
        if (uPass === P && uCode === C) {
            document.getElementById('login-area').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
        } else { alert("ভুল পাসওয়ার্ড বা কোড!"); }
    }

    function showYearList(type) {
        window.currentType = type;
        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('search-container').style.display = 'block';
        document.getElementById('list-screen').style.display = 'block';
        document.getElementById('backIcon').style.display = 'block';
        document.getElementById('topTitle').innerText = type + " - বছর";

        let container = document.getElementById('list-screen');
        container.innerHTML = "";
        for (let year = 2026; year <= 2035; year++) {
            let div = document.createElement('div');
            div.className = 'list-item';
            div.innerHTML = `<span class="item-text">Year: ${year}</span><span style="color:#1a73e8">❯</span>`;
            div.onclick = () => showDateList(year);
            container.appendChild(div);
        }
    }

    function showDateList(year) {
        window.currentYear = year;
        document.getElementById('topTitle').innerText = window.currentType + " - " + year;
        let container = document.getElementById('list-screen');
        container.innerHTML = "";
        let date = new Date(year, 0, 1);
        while (date.getFullYear() === year) {
            let dStr = date.getDate() + "/" + (date.getMonth() + 1) + "/" + date.getFullYear();
            let div = document.createElement('div');
            div.className = 'list-item';
            div.innerHTML = `<span class="item-text">${dStr}</span><span style="color:#1a73e8">❯</span>`;
            div.onclick = () => openSheet(dStr);
            container.appendChild(div);
            date.setDate(date.getDate() + 1);
        }
    }

    function openSheet(dateTitle) {
        document.getElementById('search-container').style.display = 'none';
        document.getElementById('list-screen').style.display = 'none';
        document.getElementById('sheet-screen').style.display = 'block';
        document.getElementById('topTitle').innerText = dateTitle;
        document.getElementById('sheetFrame').src = sheetURL;
    }

    function filterItems() {
        let input = document.getElementById('globalSearch').value.toLowerCase();
        let items = document.getElementsByClassName('list-item');
        for (let item of items) {
            let text = item.innerText.toLowerCase();
            item.style.display = text.includes(input) ? "flex" : "none";
        }
    }

    function handleBack() {
        if (document.getElementById('sheet-screen').style.display === 'block') {
            document.getElementById('sheet-screen').style.display = 'none';
            document.getElementById('search-container').style.display = 'block';
            document.getElementById('list-screen').style.display = 'block';
