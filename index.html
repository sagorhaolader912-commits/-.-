<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মেসার্স সাগর ফিস</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; background-color: #f4f7f6; margin: 0; padding: 10px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .header { background: #1a73e8; color: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        .btn-main { padding: 18px; width: 95%; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; margin: 8px; font-size: 18px; color: white; background: #28a745; }
        .btn-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; max-height: 450px; overflow-y: auto; padding: 10px; border: 1px solid #eee; border-radius: 10px; }
        .btn-item { padding: 12px; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; background: #e3f2fd; color: #333; font-weight: bold; position: relative; }
        .btn-item:active { background: #bbdefb; }
        .btn-back { background: #6c757d; width: 95%; margin-top: 15px; color: white; padding: 12px; border: none; border-radius: 8px; cursor: pointer; }
        iframe { width: 100%; height: 500px; border: 1px solid #ddd; border-radius: 10px; margin-top: 20px; display: none; }
        #sub-menu { display: none; }
        .info-text { font-size: 12px; color: #666; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header"><h1>মেসার্স সাগর ফিস</h1></div>

    <div id="home-menu">
        <button class="btn-main" onclick="showMenu('Arat')">আড়ৎ এর হিসাব (১২০টি)</button>
        <button class="btn-main" style="background:#e91e63" onclick="showMenu('Company')">বিক্রয়ের হিসাব (২০টি)</button>
        <button class="btn-main" style="background:#f39c12" onclick="resetNames()">সব নাম আগের মতো করুন</button>
    </div>

    <div id="sub-menu">
        <h3 id="menu-title">তালিকা:</h3>
        <p class="info-text">নাম বদলাতে চাইলে বাটনের ওপর চেপে ধরে রাখুন</p>
        <div id="dynamic-buttons" class="btn-list"></div>
        <button class="btn-back" onclick="goHome()">← পেছনে যান</button>
    </div>

    <iframe id="sheetFrame" src=""></iframe>
</div>

<script>
    const myLink = "https://docs.google.com/spreadsheets/d/1BlbOrJsve7AjU9Yn9qze8k5qNcVeaKqI_HXXG42RKE/edit?usp=sharing";
    
    // সেভ করা নামগুলো নিয়ে আসা অথবা নতুন তৈরি করা
    let savedNames = JSON.parse(localStorage.getItem('sagarFishNames')) || {
        'Arat': Array.from({length: 120}, (_, i) => `আড়ৎ ${i + 1}`),
        'Company': Array.from({length: 20}, (_, i) => `কোম্পানি ${i + 1}`)
    };

    function showMenu(type) {
        document.getElementById('home-menu').style.display = 'none';
        document.getElementById('sub-menu').style.display = 'block';
        document.getElementById('menu-title').innerText = type === 'Arat' ? "আড়ৎ নির্বাচন করুন:" : "কোম্পানি নির্বাচন করুন:";
        renderButtons(type);
    }

    function renderButtons(type) {
        const container = document.getElementById('dynamic-buttons');
        container.innerHTML = ""; 
        
        savedNames[type].forEach((name, index) => {
            const btn = document.createElement('button');
            btn.className = 'btn-item';
            btn.innerText = name;
            
            // ক্লিক করলে শিট খুলবে
            btn.onclick = () => openSheet();

            // চেপে ধরে রাখলে (Long Press) রিনেম হবে
            let timer;
            btn.onmousedown = btn.ontouchstart = () => {
                timer = setTimeout(() => {
                    let newName = prompt("নতুন নাম লিখুন:", name);
                    if (newName) {
                        savedNames[type][index] = newName;
                        localStorage.setItem('sagarFishNames', JSON.stringify(savedNames));
                        renderButtons(type);
                    }
                }, 800);
            };
            btn.onmouseup = btn.onmouseleave = btn.ontouchend = () => clearTimeout(timer);

            container.appendChild(btn);
        });
    }

    function openSheet() {
        const frame = document.getElementById('sheetFrame');
        frame.style.display = 'block';
        frame.src = myLink + "&rm=minimal";
    }

    function resetNames() {
        if(confirm("আপনি কি সব নাম মুছে আগের মতো (আড়ৎ ১, ২...) করতে চান?")) {
            localStorage.removeItem('sagarFishNames');
            location.reload();
        }
    }

    function goHome() {
        document.getElementById('home-menu').style.display = 'block';
        document.getElementById('sub-menu').style.display = 'none';
        document.getElementById('sheetFrame').style.display = 'none';
    }
</script>

</body>
</html>
