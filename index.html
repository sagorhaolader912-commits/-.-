<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মেসার্স সাগর ফিস</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; background-color: #f0f4f8; margin: 0; padding: 10px; }
        .container { max-width: 550px; margin: auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .header { background: #1a73e8; color: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        .btn-main { padding: 15px; width: 95%; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin: 5px; font-size: 16px; color: white; background: #28a745; }
        .btn-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; max-height: 400px; overflow-y: auto; padding: 5px; }
        .btn-item { padding: 10px; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; background: #ffffff; color: #333; font-weight: 500; font-size: 13px; transition: 0.2s; }
        .btn-item:hover { background: #e3f2fd; border-color: #1a73e8; }
        .btn-back { background: #6c757d; width: 95%; margin-top: 15px; color: white; padding: 12px; border: none; border-radius: 8px; cursor: pointer; }
        iframe { width: 100%; height: 500px; border: 1px solid #ddd; border-radius: 10px; margin-top: 20px; display: none; }
        #sub-menu { display: none; }
        h3 { color: #1a73e8; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="margin:0;">মেসার্স সাগর ফিস</h1>
        <small>ডিজিটাল হিসাব ব্যবস্থাপনা</small>
    </div>

    <div id="home-menu">
        <button class="btn-main" onclick="showSubMenu('Arat')">আড়ৎ এর হিসাব (১২০টি)</button>
        <button class="btn-main" style="background:#e91e63" onclick="showSubMenu('Company')">বিক্রয়ের হিসাব (২০টি)</button>
        <button class="btn-main" style="background:#f39c12" onclick="window.open('আপনার_গুগল_শিট_লিঙ্ক', '_blank')">✎ গুগল শিটে নাম পরিবর্তন করুন</button>
    </div>

    <div id="sub-menu">
        <h3 id="menu-title">তালিকা:</h3>
        <div id="dynamic-buttons" class="btn-list">
            </div>
        <button class="btn-back" onclick="goHome()">← প্রধান মেনুতে ফিরুন</button>
    </div>

    <iframe id="sheetFrame" src=""></iframe>
</div>

<script>
    // ১. আপনার গুগল শিটের সঠিক শেয়ার লিঙ্কটি নিচের কোটেশনের ভেতরে বসান
    const mySheetURL = "আপনার_গুগল_শিট_লিঙ্ক"; 

    // ২. এখানে ১২০টি আড়ত এবং ২০টি কোম্পানির নাম সাজানো আছে
    // আপনি চাইলে শুধু নামগুলো পরিবর্তন করে আপনার আসল নাম দিতে পারেন
    const myData = {
        'Arat': Array.from({length: 120}, (_, i) => `আড়ৎ ${i + 1}`),
        'Company': Array.from({length: 20}, (_, i) => `কোম্পানি ${i + 1}`)
    };

    // আপনি যদি নির্দিষ্ট নাম দিতে চান, তবে এভাবে লিখুন:
    // 'Arat': ['আড়ৎ ক', 'আড়ৎ খ', 'আড়ৎ গ' ... ১২০টি নাম],

    function showSubMenu(type) {
        document.getElementById('home-menu').style.display = 'none';
        document.getElementById('sub-menu').style.display = 'block';
        document.getElementById('menu-title').innerText = type === 'Arat' ? "আড়ৎ নির্বাচন করুন:" : "কোম্পানি নির্বাচন করুন:";
        
        const container = document.getElementById('dynamic-buttons');
        container.innerHTML = ""; 
        
        myData[type].forEach(name => {
            const btn = document.createElement('button');
            btn.className = 'btn-item';
            btn.innerText = name;
            btn.onclick = () => openSheet(name);
            container.appendChild(btn);
        });
    }

    function openSheet(name) {
        const frame = document.getElementById('sheetFrame');
        frame.style.display = 'block';
        // এখানে ক্লিক করলে গুগল শিটটি লোড হবে
        frame.src = mySheetURL + "&rm=minimal";
        console.log("Opening details for: " + name);
    }

        document.getElementById('home-menu').style.
