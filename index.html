<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>মেসার্স সাগর ফিস</title>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: #f4f6f9; font-family: Arial, sans-serif; }
        
        .header { background: #1a73e8; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; position: relative; }
        .back-btn { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); background: #28a745; color: white; padding: 5px 10px; border-radius: 5px; display: none; border: none; }

        #login-page { position: fixed; inset: 0; background: white; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .site-name { color: #1a73e8; font-size: 26px; font-weight: bold; margin-bottom: 25px; }
        input { width: 70%; padding: 15px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 8px; text-align: center; }

        #main-app { display: none; height: 100%; flex-direction: column; }
        
        /* মেনু এরিয়া - বক্সগুলো মাঝখানে থাকবে */
        .menu-area { padding: 30px 10px; display: flex; flex-direction: column; align-items: center; gap: 20px; flex-grow: 1; }
        
        /* বক্স ডিজাইন: চওড়া কম (Width 60%), উচ্চতা বেশি (Height বাড়ানো হয়েছে) */
        .btn-container { 
            background: white; 
            padding: 25px 15px; /* উচ্চতা বাড়ানোর জন্য প্যাডিং বাড়ানো হয়েছে */
            border-radius: 15px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            border: 1px solid #ddd;
            width: 60%; /* চওড়া অনেক কমানো হয়েছে */
            min-width: 220px;
            text-align: center;
        }
        
        .btn { padding: 15px; border: none; border-radius: 10px; font-weight: bold; color: white; font-size: 16px; cursor: pointer; width: 100%; }
        .btn-green { background: #28a745; }
        .btn-pink { background: #e91e63; }
        .btn-gray { padding: 12px; background: #6c757d; width: 60%; margin-top: auto; margin-bottom: 30px; }

        .shortcut-stats { margin-top: 15px; font-size: 13px; font-weight: bold; color: #444; display: flex; flex-direction: column; gap: 5px; }
        .stat-joma { color: #2e7d32; } 
        .stat-jer { color: #c62828; }  

        .list-container { flex-grow: 1; overflow-y: auto; padding: 15px; display: none; }
        .item-card { padding: 15px; background: #fff; border: 1px solid #eee; margin-bottom: 10px; border-radius: 10px; font-weight: bold; text-align: center; }

        .sheet-container { flex-grow: 1; display: none; flex-direction: column; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div id="login-page">
        <div class="site-name">মেসার্স সাগর ফিস</div>
        <input type="password" id="passInput" placeholder="পাসওয়ার্ড">
        <button class="btn btn-green" style="width: 70%;" onclick="handleLogin()">লগইন</button>
    </div>

    <div id="main-app">
        <div class="header">
            <button id="backIcon" class="back-btn" onclick="handleBack()">←</button>
            <span id="topTitle">মেসার্স সাগর ফিস</span>
        </div>

        <div id="home-screen" class="menu-area">
            <div class="btn-container">
                <button class="btn btn-green" onclick="showList('Arat')">আড়ৎ এর হিসাব</button>
                <div class="shortcut-stats">
                    <span class="stat-joma">জমা: ৳ ....</span>
                    <span class="stat-jer">জের: ৳ ....</span>
                </div>
            </div>

            <div class="btn-container">
                <button class="btn btn-pink" onclick="showList('Company')">বিক্রয়ের হিসাব</button>
                <div class="shortcut-stats">
                    <span class="stat-joma">জমা: ৳ ....</span>
                    <span class="stat-jer">জের: ৳ ....</span>
                </div>
            </div>

            <button class="btn btn-gray" onclick="location.reload()">লগ আউট</button>
        </div>

        <div id="list-screen" class="list-container">
            <div id="list-items"></div>
        </div>

        <div id="sheet-screen" class="sheet-container">
            <iframe id="sheetFrame" src=""></iframe>
        </div>
    </div>

<script>
    const PASS = "sagar";
    const SHEET_URL = "https://docs.google.com/spreadsheets/d/10VFHqozMCUa6GlVzraUAloLex-NAHijfwfBl4rBHFSY/edit?rm=minimal";
    let currentState = "home";

    function handleLogin() {
        const input = document.getElementById('passInput').value;
        if (input === PASS) {
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
        } else { alert("ভুল পাসওয়ার্ড!"); }
    }

    function showList(type) {
        currentState = "list";
        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('list-screen').style.display = 'block';
        document.getElementById('backIcon').style.display = 'block';
        document.getElementById('topTitle').innerText = (type === 'Arat' ? "আড়ৎ তালিকা" : "কোম্পানি তালিকা");
        const container = document.getElementById('list-items');
        container.innerHTML = "";
        const total = (type === 'Arat' ? 120 : 20);
        const prefix = (type === 'Arat' ? "আড়ৎ" : "কোম্পানি");
        for (let i = 1; i <= total; i++) {
            let div = document.createElement('div');
            div.className = 'item-card';
            div.innerText = prefix + " " + i;
            div.onclick = function() { openSheet(prefix + " " + i); };
            container.appendChild(div);
        }
    }

    function openSheet(name) {
        currentState = "sheet";
        document.getElementById('list-screen').style.display = 'none';
        document.getElementById('sheet-screen').style.display = 'flex';
        document.getElementById('topTitle').innerText = name;
        document.getElementById('sheetFrame').src = SHEET_URL;
    }

    function handleBack() {
        if (currentState === "sheet") {
            document.getElementById('sheet-screen').style.display = 'none';
            document.getElementById('list-screen').style.display = 'block';
            document.getElementById('topTitle').innerText = "তালিকা";
            document.getElementById('sheetFrame').src = "";
            currentState = "list";
        } else if (currentState === "list") {
            document.getElementById('list-screen').style.display = 'none';
            document.getElementById('home-screen').style.display = 'flex';
            document.getElementById('backIcon').style.display = 'none';
            document.getElementById('topTitle').innerText = "মেসার্স সাগর ফিস";
            currentState = "home";
        }
    }
</script>
</body>
</html>
