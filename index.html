<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মেসার্স সাগর ফিস</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #eef2f7; margin: 0; display: flex; justify-content: center; padding: 10px; }
        .app-card { background: white; width: 100%; max-width: 450px; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.15); min-height: 95vh; display: flex; flex-direction: column; }
        .header { background: #1a73e8; color: white; padding: 20px; text-align: center; font-size: 20px; font-weight: bold; border-radius: 15px 15px 0 0; }
        .content { padding: 20px; flex-grow: 1; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; text-align: center; }
        .show-pass { font-size: 14px; color: #555; display: flex; align-items: center; justify-content: center; gap: 8px; margin: 10px 0; cursor: pointer; user-select: none; }
        .btn { width: 100%; padding: 14px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn-back { background: #6c757d; }
        #searchBox { border: 2px solid #1a73e8; position: sticky; top: 0; z-index: 10; margin-bottom: 15px; }
        .list-item { background: #fdfdfd; padding: 15px; border: 1px solid #ddd; border-radius: 10px; margin-bottom: 10px; cursor: pointer; display: flex; justify-content: space-between; font-weight: 500; }
        .list-item:hover { background: #e8f0fe; }
        #login-sec, #menu-sec, #year-sec { display: none; }
    </style>
</head>
<body>

<div class="app-card">
    <div class="header">মেসার্স সাগর ফিস</div>
    <div class="content">
        <div id="login-sec" style="display: block;">
            <input type="password" id="passInput" placeholder="পাসওয়ার্ড লিখুন" autocomplete="off">
            <input type="password" id="pinInput" placeholder="পিন কোড লিখুন" autocomplete="off">
            <label class="show-pass">
                <input type="checkbox" id="toggleCheck"> পাসওয়ার্ড ও পিন দেখুন
            </label>
            <button class="btn" onclick="checkLogin()">প্রবেশ করুন</button>
        </div>

        <div id="menu-sec">
            <button class="btn" onclick="openYears('আড়ৎ-এর হিসাব')">আড়ৎ-এর হিসাব</button>
            <button class="btn" onclick="openYears('বিক্রয় হিসাব')">বিক্রয় হিসাব</button>
            <button class="btn btn-back" onclick="location.reload()">লগ আউট</button>
        </div>

        <div id="year-sec">
            <h3 id="sec-title">বাছাই করুন</h3>
            <input type="text" id="searchBox" onkeyup="searchData()" placeholder="খুঁজুন...">
            <div id="list-container"></div>
            <button id="backBtn" class="btn btn-back">পিছনে যান</button>
        </div>
    </div>
</div>

<script>
    const sheetURL = "https://docs.google.com/spreadsheets/d/1jMOhvqNJMWrGjrwm3DVylQl9tBRHqP3KOKJNzkHABls/edit?usp=sharing";
    const months = ["জানুয়ারি", "ফেব্রুয়ারি", "মার্চ", "এপ্রিল", "মে", "জুন", "জুলাই", "আগস্ট", "সেপ্টেম্বর", "অক্টোবর", "নভেম্বর", "ডিসেম্বর"];

    // পাসওয়ার্ড ও পিন দেখানো বা লুকানোর ফাংশন
    document.getElementById('toggleCheck').addEventListener('change', function() {
        const type = this.checked ? 'text' : 'password';
        document.getElementById('passInput').type = type;
        document.getElementById('pinInput').type = type;
    });

    function checkLogin() {
        const pass = document.getElementById('passInput').value;
        const pin = document.getElementById('pinInput').value;
        if(pass === "sagorfish" && pin === "2026") {
            document.getElementById('login-sec').style.display = 'none';
            document.getElementById('menu-sec').style.display = 'block';
        } else { 
            alert("ভুল পাসওয়ার্ড বা পিন! আবার চেষ্টা করুন।"); 
        }
    }

    function openYears(title) {
        document.getElementById('menu-sec').style.display = 'none';
        document.getElementById('year-sec').style.display = 'block';
        document.getElementById('sec-title').innerText = title;
        const container = document.getElementById('list-container');
        container.innerHTML = "";
        for (let year = 2026; year <= 2035; year++) {
            let div = document.createElement('div');
            div.className = 'list-item';
            div.innerHTML = `<span>📅 ${year} সাল</span> ❯`;
            div.onclick = () => openMonths(year, title);
            container.appendChild(div);
        }
        document.getElementById('backBtn').onclick = () => { document.getElementById('year-sec').style.display='none'; document.getElementById('menu-sec').style.display='block'; };
    }

    function openMonths(year, title) {
        document.getElementById('sec-title').innerText = year + " সালের মাসসমূহ";
        const container = document.getElementById('list-container');
        container.innerHTML = "";
        months.forEach((m) => {
            let div = document.createElement('div');
            div.className = 'list-item';
            div.innerHTML = `<span>📂 ${m}</span> ❯`;
            div.onclick = () => openDates(m, year, title);
            container.appendChild(div);
        });
        document.getElementById('backBtn').onclick = () => openYears(title);
    }

    function openDates(month, year, title) {
        document.getElementById('sec-title').innerText = month + " " + year;
        const container = document.getElementById('list-container');
        container.innerHTML = "";
        for (let i = 1; i <= 31; i++) {
            let div = document.createElement('div');
            div.className = 'list-item';
            div.innerHTML = `<span>📝 তারিখ: ${i}-${month}-${year}</span> ❯`;
            div.onclick = () => window.location.href = sheetURL;
            container.appendChild(div);
        }
        document.getElementById('backBtn').onclick = () => openMonths(year, title);
    }

    function searchData() {
        let input = document.getElementById('searchBox').value.toLowerCase();
        let items = document.getElementsByClassName('list-item');
        for (let i = 0; i < items.length; i++) {
            items[i].style.display = items[i].innerText.toLowerCase().includes(input) ? "" : "none";
        }
    }
</script>
</body>
</html>
