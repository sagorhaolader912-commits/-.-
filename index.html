<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মেসার্স সাগর ফিস - অফিশিয়াল</title>
    <style>
        :root {
            --primary-color: #1a73e8;
            --secondary-color: #28a745;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
        }
        .navbar {
            background-color: var(--primary-color);
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .main-content {
            max-width: 1000px;
            margin: 20px auto;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        iframe {
            width: 100%;
            height: 500px;
            border: none;
            border-radius: 5px;
        }
        .admin-panel {
            margin-top: 20px;
            padding: 20px;
            border-top: 2px dashed #ccc;
            text-align: center;
        }
        .edit-btn {
            background-color: var(--secondary-color);
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 25px;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: 0.3s;
        }
        .edit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        .footer-text {
            font-size: 12px;
            color: #777;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="navbar">
        মেসার্স সাগর ফিস - ডিজিটাল ড্যাশবোর্ড
    </div>

    <div class="main-content">
        <iframe src="https://docs.google.com/spreadsheets/d/YOUR_SHEET_ID/pubhtml?widget=true&headers=false"></iframe>
        
        <div class="admin-panel">
            <p style="margin-bottom: 15px; font-weight: bold; color: #333;">অ্যাডমিনদের জন্য (মোবাইল/পিসি এডিট)</p>
            <a href="https://docs.google.com/spreadsheets/d/YOUR_SHEET_ID/edit" target="_blank" class="edit-button">
            হিসাব এডিট করুন
        </a>
            <p class="footer-text">সতর্কতা: শুধুমাত্র অনুমোদিত অ্যাডমিনরাই এডিট করতে পারবেন।</p>
        </div>
    </div>

</body>
</html>
