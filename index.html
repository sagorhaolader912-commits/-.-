<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মেসার্স সাগর ফিস</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f0f4f7; padding: 50px; }
        .login-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: inline-block; }
        input { padding: 12px; margin: 10px; border: 1px solid #ddd; border-radius: 5px; width: 200px; }
        button { padding: 12px 25px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        iframe { width: 100%; height: 600px; border: none; margin-top: 20px; display: none; }
    </style>
</head>
<body>
    <div id="login-area" class="login-card">
        <h2>মেসার্স সাগর ফিস</h2>
        <p>লগইন পাসওয়ার্ড দিন</p>
        <input type="password" id="passInput" placeholder="Password"> <br>
        <button onclick="login()">প্রবেশ করুন</button>
    </div>

    <div id="content-area" style="display:none;">
        <h3>আপনার ব্যবসার লাইভ হিসাব</h3>
        <iframe id="sheetFrame" src="https://docs.google.com/spreadsheets/d/1XoX4E7u5-oY_2C_1Rz-W7E8y-vP5v9Xf99y6V7vX_I0/edit?usp=sharing"></iframe>
    </div>

    <script>
        function login() {
            var pass = document.getElementById("passInput").value;
            if(pass === "sagar123") { 
                document.getElementById("login-area").style.display = "none";
                document.getElementById("content-area").style.display = "block";
                document.getElementById("sheetFrame").style.display = "block";
            } else { alert("ভুল পাসওয়ার্ড!"); }
        }
    </script>
</body>
</html>
