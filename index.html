<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>মেসার্স সাগর ফিস</title>
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: #f0f2f5; font-family: 'Segoe UI', Arial, sans-serif; }
        
        .container { height: 100%; width: 100%; max-width: 600px; margin: auto; background: white; display: flex; flex-direction: column; position: relative; }

        /* হেডলাইন ডিজাইন - আপনার প্রিয় নীল কালার */
        .header { 
            background: #1a73e8; color: white; padding: 18px; text-align: center; 
            font-size: 24px; font-weight: bold; position: relative; flex-shrink: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* সবুজ ব্যাক বাটন - বাম কোণায় পারমানেন্ট */
        .back-btn { 
            position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
            background: #28a745; color: white; width: 40px; height: 35px; 
            border-radius: 6px; display: none; align-items: center; justify-content: center;
            font-size: 20px; font-weight: bold; cursor: pointer; border: none;
        }

        /* লগইন স্ক্রিন */
        #login-page { position: absolute; inset: 0; background: white; z-index: 100; display: flex; flex-direction: column; align-items: center; padding-top: 100px; }
        input { width: 80%; padding: 15px; margin-bottom: 20px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; text-align: center; }

        /* মেনু ও তালিকা */
        #main-app { display: none; flex-direction: column; height: 100%; width: 100%; }
        .menu-area { padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .btn { padding: 18px; width: 100%; border: none; border-radius: 12px; font-weight: bold; color: white; font-size: 16px; cursor: pointer; }
        .btn-green { background: #28a745; }
        .btn-pink { background: #e91e63; }
        .btn-gray { background: #6c757d; }

        /* খাতা এরিয়া */
        .list-container { flex-grow: 1; overflow-y: auto; padding: 15px; }
        .item-card { padding: 15px; background: #f8f9fa; border: 1px solid #ddd; margin-bottom: 10px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        
        .sheet-wrapper { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        .labels { display: flex; background: #0d47a1; color: white; font-size: 12px; min-width: 600px; padding: 10px 0; }
        .labels div { width: 100px; text-align: center; border-right: 1px solid rgba(255,255,255,0.1); }
        .iframe-container { flex-grow: 1; overflow: auto; min-width: 600px; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-page">
        <div style="font-size: 26px; font-weight: bold; color: #1a73e8; margin-bottom: 30px;">মেসার্স সাগর ফিস</div>
        <input type="password" id="pass" placeholder="পাসওয়ার্ড দিন">
        <button class="btn btn-green" style="width: 80%;" onclick="login()">লগইন</button>
    </div>

    <div id="main-app">
        <div class="header">
            <div id="backIcon" class="back-btn" onclick="goBack()">←</div>
            <span id="titleText">মেসার্স সাগর ফিস</span>
        </div>

        <div id="home-screen" class="menu-area">
            <button class="btn btn-green" onclick="showList('Arat')">আড়ৎ এর হিসাব</button>
            <button class="btn btn-pink" onclick="showList('Company')">বিক্রয়ের হিসাব</button>
            <button class="btn btn-gray" style="margin-top: 20px;" onclick="location.reload()">লগ আউট</button>
        </div>

        <div id="list-screen" class="list-container" style="display: none;">
            <div id="list-items"></div>
        </div>

        <div id="sheet-screen" class="sheet-wrapper" style="display: none;">
            <div style="overflow-x: auto; flex-grow: 1; display: flex; flex-direction: column;">
