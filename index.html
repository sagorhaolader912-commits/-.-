<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মেসার্স সাগর ফিস</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; background-color: #f0f2f5; margin: 0; padding: 10px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); min-height: 90vh; margin-top: 20px; }
        .header { background: #1a73e8; color: white; padding: 20px; border-radius: 12px; margin-bottom: 25px; font-size: 24px; font-weight: bold; }
        
        .btn-main { padding: 18px; width: 100%; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; margin-bottom: 10px; color: white; background: #28a745; font-size: 18px; transition: 0.3s; }
        .btn-main:hover { opacity: 0.9; }
        .back-btn { background: #6c757d !important; margin-top: 15px; }

        input { width: 90%; padding: 15px; margin: 15px 0; border: 2px solid #ddd; border-radius: 10px; text-align: center; font-size: 18px; outline: none; }
        input:focus { border-color: #1a73e8; }

        .btn-list { display: flex; flex-direction: column; gap: 10px; max-height: 450px; overflow-y: auto; padding: 5px; }
        .item-row { display: flex; align-items: center; background: #f8f9fa; border-radius: 10px; border: 1px solid #ddd; cursor: pointer; transition: 0.2s; }
        .item-row:hover { background: #eef2f7; }
        .item-name { flex-grow: 1; padding: 18px; font-weight: 600; text-align: left; font-size: 16px; color: #333; }

        /* Tali Khata Table */
        .tali-table-container { margin-top: 10px; border: 2px solid #1a73e8; border-radius: 10px; overflow: hidden; }
        .tali-header { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr; background: #1a73e8; color: white; font-size: 11px; font-weight: bold; padding: 12px 2px; }
        iframe { width: 100%; height: 600px; border: none; background: white; }

        /* Sections Visibility */
        #step2, #app-content, #sub-menu, #tali-khata-page { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="step1">
        <div class="header">মেসার্স সাগর ফিস</div>
        <input type="password" id="passInput" placeholder="পাসওয়ার্ড দিন">
        <button class="btn-main" onclick="checkPassword()">পরবর্তী ধাপ</button>
    </div>
    
    <div id="step2">
        <div class="header">সিকিউরিটি যাচাই</div>
        <input type="number" id="twoFactorInput" placeholder="কোড দিন">
        <button class="btn-main" onclick="verifyCode()">লগইন করুন</button>
    </div>

    <div id="app-content">
        <div id="home-menu">
            <div class="header">প্রধান মেনু</div>
            <button class="btn-main" onclick="showMenu('Arat')">আড়ৎ এর হিসাব</button>
            <button class="btn-main" style="background:#e91e63" onclick="showMenu('Company')">বিক্রয়ের হিসাব</button>
            <button class="btn-main" style="background:#6c757d" onclick="location.reload()">লগ আউট</button>
        </div>

        <div id="sub-menu">
            <div class="header" id="menu-title">তালিকা</div>
            <div id="dynamic-buttons" class="btn-list"></div>
            <button class="btn-main back-btn" onclick="goHome()">← ফিরে যান</button>
        </div>

        <div id="tali-khata-page">
            <div class="header" id="tali-title">খাতা</div>
            <div class="tali-table-container">
                <div class="tali-header">
                    <div>তারিখ</div><div>সাইজ</div><div>দর</div><div>মোট</div><div>জমা</div><div>জের</div>
                </div>
                <iframe id="sheetFrame" src=""></iframe>
            </div>
            <button class="btn-main back-btn" onclick="closeTali()">← তালিকায় ফিরুন</button>
        </div>
    </div>
</div>

<script>
    const MAIN_PASSWORD = "sagar"; 
    const TWO_FACTOR_CODE = "998877"; 
    const MY_SHEET_URL = "https://docs.google.com/spreadsheets/d/10VFHqozMCUa6GlVzraUAloLex-NAHijfwfBl4rBHFSY/preview";

    function checkPassword() {
        const pass = document.getElementById('passInput').value;
        if(pass === MAIN_PASSWORD) {
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
        } else {
            alert("ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।");
        }
    }

    function verifyCode() {
        const code = document.getElementById('twoFactorInput').value;
        if(code === TWO_FACTOR_CODE) {
            document.getElementById('step2').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
        } else {
            alert("ভুল সিকিউরিটি কোড!");
        }
    }

    const savedNames = {
        'Arat': Array.from({length: 120}, (_, i) => `আড়ৎ ${i + 1}`),
        'Company': Array.from({length: 20}, (_, i) => `কোম্পানি ${i + 1}`)
    };

    function showMenu(type) {
        document.getElementById('home-menu').style.display = 'none';
        document.getElementById('sub-menu').style.display = 'block';
        document.getElementById('menu-title').innerText = type === 'Arat' ? "আড়ৎ নির্বাচন করুন" : "কোম্পানি নির্বাচন করুন";
        
        const container = document.getElementById('dynamic-buttons');
        container.innerHTML = "";
        savedNames[type].forEach((name) => {
            const row = document.createElement('div');
            row.className = 'item-row';
            row.innerHTML = `<div class="item-name">${name}</div>`;
            row.onclick = () => openTaliKhata(name);
            container.appendChild(row);
        });
    }

    function openTaliKhata(name) {
        document.getElementById('sub-menu').style.display = 'none';
        document.getElementById('tali-khata-page').style.display = 'block';
        document.getElementById('tali-title').innerText = name;
        document.getElementById('sheetFrame').src = MY_SHEET_URL;
    }

    function closeTali() {
        document.getElementById('tali-khata-page').style.display = 'none';
        document.getElementById('sub-menu').style.display = 'block';
        document.getElementById('sheetFrame').src = "";
    }

    function goHome() {
        document.getElementById('sub-menu').style.display = 'none';
        document.getElementById('home-menu').style.display = 'block';
    }
</script>

</body>
</html>
