<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মেসার্স সাগর ফিস</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { margin: 0; background: #f0f2f5; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-box { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 320px; }
        h2 { color: #1a73e8; margin-bottom: 20px; }
        input[type="password"], input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; text-align: center; font-size: 18px; outline: none; }
        .show-pass-label { margin-top: 15px; display: flex; align-items: center; justify-content: center; font-size: 15px; cursor: pointer; color: #555; }
        .show-pass-label input { margin-right: 8px; width: 18px; height: 18px; cursor: pointer; }
        button { width: 100%; padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>মেসার্স সাগর ফিস</h2>
        
        <input type="password" id="pinInput" placeholder="পিন কোড লিখুন">
        
        <label class="show-pass-label">
            <input type="checkbox" onclick="togglePass()"> পিন দেখুন
        </label>

        <button onclick="checkLogin()">প্রবেশ করুন</button>
    </div>

    <script>
        // পিন দেখা বা লুকানোর ফাংশন
        function togglePass() {
            var x = document.getElementById("pinInput");
            if (x.type === "password") {
                x.type = "text";
            } else {
                x.type = "password";
            }
        }

        // লগইন চেক এবং অন্য পেজে যাওয়ার ফাংশন
        function checkLogin() {
            var pin = document.getElementById("pinInput").value;
            
            // আপনার পিন এখানে (বর্তমানে 2026 দেওয়া)
            if (pin === "2026") {
                // পিন মিললে এই লিংকে নিয়ে যাবে (নিচের লিংকে আপনার গুগল শিটের লিংক দিন)
                window.location.href = "https://docs.google.com/spreadsheets/"; 
            } else {
                alert("ভুল পিন! সঠিক পিন দিন।");
            }
        }
    </script>

</body>
</html>
